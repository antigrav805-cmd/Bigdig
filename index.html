<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Dig — сборки</title>
<style>
  :root { color-scheme: dark; --bg:#121216; --card:#1d1d24; --text:#e9e6df; --muted:#9a968e; --accent:#e0a84a; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  a.v { display:block; background:var(--card); border-radius:12px; padding:16px; margin:0 0 12px; color:inherit; text-decoration:none; border:1px solid #2a2a33; }
  a.v:active { border-color:var(--accent); }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .name { font-weight:600; font-size:18px; }
  .new { color:#121216; background:var(--accent); border-radius:6px; padding:1px 7px; font-size:12px; font-weight:700; margin-left:6px; }
  .date { color:var(--muted); font-size:13px; white-space:nowrap; }
  .notes { color:var(--muted); font-size:14px; margin-top:6px; }
  .tip { color:var(--muted); font-size:13px; margin-top:28px; }
</style>
</head>
<body>
<main>
  <h1>Big Dig</h1>
  <p class="sub">Тестовые сборки. Новая версия — сверху. Первая загрузка около 15 МБ, лучше по Wi-Fi.</p>
  <div id="list"></div>
  <p class="tip">Управление: касание левой и правой половины экрана — руль. Если игра не обновилась, обновите страницу.</p>
</main>
<script>
  // Новая версия — первой строкой.
  const versions = [
    { dir: "v24", name: "v24", date: "12.11.2026",
      notes: "Кран опускает машину на тросе. Бур крутится на 360°: вернуться можно своим ходом, развернув бур вверх. Лебёдка в магазине вытаскивает сама." },
    { dir: "v23", name: "v23", date: "12.11.2026",
      notes: "Меньше тряски: камеру трясёт только от настоящих ударов, дрожь машины мягче." },
    { dir: "v22", name: "v22", date: "12.11.2026",
      notes: "Живой фон: трава на ветру, облака, шкив копра, руда на конвейере, дым, сигнальный огонь, птицы, ночью звёзды. Слышен ветер." },
    { dir: "v21", name: "v21", date: "12.11.2026",
      notes: "Новый интерфейс: минималистичное стеклянное меню, фон открыт, янтарная кнопка «Спуск», модули в сборке — картинками." },
    { dir: "v20", name: "v20", date: "12.11.2026",
      notes: "Глубиномер ориентировочный: «Глубина ≈ 250 м», обновляется раз в пару секунд, грубее с глубиной." },
    { dir: "v19", name: "v19", date: "12.11.2026",
      notes: "Топливо: бак в ядре, модули его жгут. Огоньки внизу ядра — топливо. Кончилось — мотор заглох, заход проигран." },
    { dir: "v18", name: "v18", date: "12.11.2026",
      notes: "Кнопка «Начать заново» внизу экрана поверхности: стирает прогресс по двойному нажатию." },
    { dir: "v17", name: "v17", date: "12.11.2026",
      notes: "На телефоне камера ближе: машина и индикаторы на ядре крупнее." },
    { dir: "v16", name: "v16", date: "12.11.2026",
      notes: "Реактор в ядре дышит, в сопле двигателя пламя. Трюм и температура — индикаторы прямо на ядре, панель в углу убрана." },
    { dir: "v15", name: "v15", date: "12.11.2026",
      notes: "Текстуры машины: металлические панели с заклёпками, окно реактора, бур со спиральными канавками — крутится, пока грызёт." },
    { dir: "v14", name: "v14", date: "12.11.2026",
      notes: "Новые звуки: мягкие и живые — рокот бура, хруст камня, тихое «тинь» руды вместо писка, маримба вместо фанфар." },
    { dir: "v13", name: "v13", date: "12.11.2026",
      notes: "Премии за вехи вдесятеро меньше: деньги теперь от руды. Мягкий ореол вокруг круга света." },
    { dir: "v12", name: "v12", date: "12.11.2026",
      notes: "Меньше обломков за пределами света: шариков на треть меньше, физика быстрее." },
    { dir: "v11", name: "v11", date: "12.11.2026",
      notes: "Круг света сдвинут вперёд, к буру: видно породу перед острием." },
    { dir: "v10", name: "v10", date: "12.11.2026",
      notes: "Без луча фары: под землёй светло только вокруг машины." },
    { dir: "v9", name: "v9", date: "12.11.2026",
      notes: "Полная темнота под землёй: видно только у машины и в луче фары." },
    { dir: "v8", name: "v8", date: "12.11.2026",
      notes: "Темнота шахты: видно только у машины и в луче фары. Мир в 6 раз шире. Руды втрое меньше, залежи крупнее." },
    { dir: "v7", name: "v7", date: "11.11.2026",
      notes: "Текстуры пород: пласты у песчаника, слои у глины, кристаллы у гранита, столбы у базальта, потоки у мантии." },
    { dir: "v6", name: "v6", date: "11.11.2026",
      notes: "Фон выкопанного туннеля светлее: не так резко отличается от породы." },
    { dir: "v5", name: "v5", date: "11.11.2026",
      notes: "Убрано преломление за хвостом: раздвигается только перемолотая порода, стенки туннеля стоят на месте." },
    { dir: "v4", name: "v4", date: "11.11.2026",
      notes: "Порода раздвигается от бура и остаётся раздвинутой: туннель за машиной открыт, стенки выстланы щебнем." },
    { dir: "v3", name: "v3", date: "11.11.2026",
      notes: "Порода раздвигается от бура, огибает машину и смыкается за хвостом. За машиной остаётся след щебня. Ничего не исчезает и не рисуется заново." },
    { dir: "v2", name: "v2", date: "11.11.2026",
      notes: "Бур — конус: грызёт косыми гранями, как клин. Порода не исчезает: туннель за машиной затягивает, пропадает только руда." },
    { dir: "v1", name: "v1", date: "11.11.2026",
      notes: "Порода из шариков на пружинках (ветка dem-particles). Исправлен всплеск обломков при обвалах." },
  ];
  const list = document.getElementById("list");
  versions.forEach((v, i) => {
    const a = document.createElement("a");
    a.className = "v";
    a.href = v.dir + "/";
    a.innerHTML = '<div class="row"><span class="name"></span><span class="date"></span></div><div class="notes"></div>';
    a.querySelector(".name").textContent = v.name;
    if (i === 0) {
      const b = document.createElement("span");
      b.className = "new"; b.textContent = "новая";
      a.querySelector(".name").appendChild(b);
    }
    a.querySelector(".date").textContent = v.date;
    a.querySelector(".notes").textContent = v.notes;
    list.appendChild(a);
  });
</script>
</body>
</html>
